# my window manager config ;)
set -sg escape-time 0
unbind C-a
unbind C-b
set-option -g prefix C-a
bind -r y setw synchronize-panes
set -g renumber-windows on
# form vim/tmux d/y buffer sync
set -g focus-events
#bind-key C-a last-window
unbind =
bind = split-window -h -c "#{pane_current_path}"
unbind -
bind - split-window -v -c "#{pane_current_path}"

# vi for copy mode
setw -g mode-keys vi

# vi for command status
set -g status-keys vi

# vi keys to resize
bind -r C-k resize-pane -U 1
bind -r C-j resize-pane -D 1
bind -r C-h resize-pane -L 1
bind -r C-l resize-pane -R 1

# vi keys to select panes
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

bind f run-shell "tmux new ~/Scripts/tmux-session-dispensary.sh"
bind E show-environment -g

# key binds for dev session
bind b send-keys -t 2 "make" C-m
bind R send-keys -t 2 "make run" C-m
bind t send-keys -t 3 "make test" C-m
bind g send-keys -t 3 "gdb ./a.out" C-m
bind C send-keys -t 2 "clear" C-m

# avoid cursor movement messing with resize
set -g repeat-time 200

# Improve terminal colors
set -a terminal-features "xterm-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

set -g status on # starting to doubt the usefulness of the status bar, just use root+i
set -g status-interval 2
set -g status-position bottom
set -g status-justify absolute-centre

set -g status-style "bg=colour0,fg=colour2"

set -g status-left-length 25
set -g status-left "#[fg=colour2,bg=colour0,bold] #H \
#[fg=colour6,bg=colour0]#(uptime | awk '{print $2, $3}' | tr -d ',') "

set -g window-status-separator " "
set -g window-status-format "#[fg=colour8,bg=colour0] #I:#W "
set -g window-status-current-format "#[fg=colour2,bg=colour0,bold]#I:#W"
set -g window-status-last-style "fg=colour6,bg=colour232"
set -g window-status-bell-style "fg=colour3,bg=colour232,bold"
set -g window-status-activity-style "fg=colour6,bg=colour232,bold"

set -g status-right-length 100
set -g status-right "\
#[fg=colour12,bg=colour0]#(tmux-cpubars) \
#[fg=colour17,bg=colour0]#(sensors | awk '/Core 0/ {print "🌡" $3}') \
#[fg=colour7,bg=colour0]#(tmux-tasks) \
#[fg=colour3,bg=colour0]#(tmux-mem)% \
#[fg=colour2,bg=colour0]#(tmux-nettraf) \
#[fg=colour9,bg=colour0]#(wget -qO - http://icanhazip.com) \
#[fg=colour208,bg=colour0]#(tmux-battery) \
#[fg=colour4,bg=colour0]%D %H:%M:%S"

set -g clock-mode-style 12
#setw -g clock-mode-colour "color0"
set -g base-index 1
setw -g pane-base-index 1
# pane borders
set -g pane-border-style "fg=colour0"
set -g pane-active-border-style "fg=colour10"
#set -g pane-border-status bottom
#set -g pane-border-format " #[fg=colour28] #P #[fg=colour10]#{pane_current_command} "

# message styling
set -g message-style "bg=colour238,fg=colour196"
set -g message-command-style "bg=colour238,fg=colour81"

# reload config
bind -r r source-file ~/.tmux.conf

set -g automatic-rename
